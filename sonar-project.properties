# Replace this with the organization key shown in SonarQube Cloud.
sonar.organization=YOUR_SONAR_CLOUD_ORGANIZATION_KEY
sonar.projectKey=rusuh-worker-service
sonar.projectName=Worker Service
sonar.projectVersion=1.0

# Go code and module metadata for accurate Go analysis.
sonar.sources=cmd,internal,pkg,go.mod
sonar.tests=cmd,internal,pkg
sonar.test.inclusions=**/*_test.go

# Exclude tests from source files and omit mocks, dependencies, build output,
# generated code, coverage files, and test fixtures from analysis.
sonar.exclusions=**/*_test.go,**/_mock/**,**/vendor/**,**/node_modules/**,**/bin/**,**/dist/**,**/build/**,**/.scannerwork/**,**/coverage/**,**/coverage.out,**/coverage.filtered.out,**/generated/**,**/*_generated.go,**/*.pb.go,**/testdata/**,**/fixtures/**,**/fixture/**,**/*_fixture.go
sonar.test.exclusions=**/_mock/**,**/vendor/**,**/node_modules/**,**/bin/**,**/dist/**,**/build/**,**/.scannerwork/**,**/coverage/**,**/coverage.out,**/coverage.filtered.out,**/generated/**,**/*_generated.go,**/*.pb.go,**/testdata/**,**/fixtures/**,**/fixture/**

# Generated by `go test ./... -race -covermode=atomic -coverprofile=coverage.out`.
sonar.go.coverage.reportPaths=coverage.out
